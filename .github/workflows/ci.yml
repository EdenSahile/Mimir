name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    needs: tests
    # Dependabot n'a pas accès aux secrets du repo : le token de review serait vide
    # et le job échouerait. On le saute pour les PR ouvertes par Dependabot.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*)"
          prompt: |
            Review the pull request thoroughly.
            Use gh pr view and gh pr diff to inspect the PR.
            If there are blocking issues, submit them with gh pr review --request-changes.
            If everything looks good or only minor issues, approve with gh pr review --approve.
