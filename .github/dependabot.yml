version: 2
updates:
  # Dépendances npm/pnpm du monorepo : racine + workspaces apps/* et packages/*.
  # directories (globs) couvre explicitement chaque manifest du workspace pnpm,
  # car ce repo utilise pnpm-workspace.yaml, pas un champ "workspaces" de package.json.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Un groupe rassemble ses updates en UNE PR, y compris entre dossiers du
      # workspace (une dépendance déclarée dans plusieurs package.json ne crée pas
      # une PR par dossier).
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Groupe ajouté pour que les majeures soient elles aussi dédoublonnées entre
      # dossiers : une seule PR par semaine, à relire et décider (quitte à la fermer
      # et traiter une majeure précise dans son propre ticket).
      major:
        update-types:
          - "major"

  # Actions utilisées par le workflow CI (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        update-types:
          - "major"
